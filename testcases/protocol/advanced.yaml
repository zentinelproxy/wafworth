meta:
  category: "Protocol Attacks"
  subcategory: "Advanced Smuggling and Protocol Abuse"
  owasp: "A05:2021, WSTG-CONF-10"
  severity: "high"

tests:
  - id: "protocol-adv-001"
    title: "Transfer-Encoding with tab obfuscation"
    tags: ["protocol", "smuggling", "evasion", "paranoia-1"]
    request:
      method: "POST"
      path: "/api/data"
      headers:
        Content-Type: "application/x-www-form-urlencoded"
        Transfer-Encoding: "chunked"
        Transfer-Encoding: "identity"
      body: "0\r\n\r\nSMUGGLED"
    expected:
      status: 403
      action: "block"

  - id: "protocol-adv-002"
    title: "H2C upgrade smuggling attempt"
    tags: ["protocol", "smuggling", "h2c", "paranoia-1"]
    request:
      method: "GET"
      path: "/api/internal"
      headers:
        Upgrade: "h2c"
        Connection: "Upgrade, HTTP2-Settings"
        HTTP2-Settings: "AAMAAABkAARAAAAAAAIAAAAA"
    expected:
      status: 403
      action: "block"

  - id: "protocol-adv-003"
    title: "WebSocket upgrade to bypass controls"
    tags: ["protocol", "websocket", "paranoia-1"]
    request:
      method: "GET"
      path: "/api/admin"
      headers:
        Upgrade: "websocket"
        Connection: "Upgrade"
        Sec-WebSocket-Key: "dGhlIHNhbXBsZSBub25jZQ=="
        Sec-WebSocket-Version: "13"
        Origin: "https://evil.com"
    expected:
      status: 403
      action: "block"

  - id: "protocol-adv-004"
    title: "CRLF injection in header name via whitespace"
    tags: ["protocol", "crlf", "evasion", "paranoia-1"]
    request:
      method: "GET"
      path: "/api/redirect"
      query_string: "url=http://example.com%0d%0aSet-Cookie:%20admin=true%0d%0a"
    expected:
      status: 403
      action: "block"
