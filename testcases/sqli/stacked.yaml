meta:
  category: "SQL Injection"
  subcategory: "Stacked Queries"
  owasp: "A03:2021, WSTG-INPV-05"
  severity: "critical"

tests:
  - id: "sqli-stacked-001"
    title: "DROP TABLE via stacked query"
    tags: ["sqli", "stacked", "paranoia-1"]
    request:
      method: "GET"
      path: "/api/users"
      query_string: "id=1; DROP TABLE users--"
    expected:
      status: 403
      action: "block"

  - id: "sqli-stacked-002"
    title: "INSERT via stacked query"
    tags: ["sqli", "stacked", "paranoia-1"]
    request:
      method: "GET"
      path: "/api/users"
      query_string: "id=1; INSERT INTO admins VALUES('hacker','password')--"
    expected:
      status: 403
      action: "block"

  - id: "sqli-stacked-003"
    title: "UPDATE via stacked query"
    tags: ["sqli", "stacked", "paranoia-1"]
    request:
      method: "GET"
      path: "/api/users"
      query_string: "id=1; UPDATE users SET password='hacked' WHERE username='admin'--"
    expected:
      status: 403
      action: "block"

  - id: "sqli-stacked-004"
    title: "CREATE TABLE via stacked query"
    tags: ["sqli", "stacked", "paranoia-1"]
    request:
      method: "GET"
      path: "/api/users"
      query_string: "id=1; CREATE TABLE backdoor(cmd VARCHAR(255))--"
    expected:
      status: 403
      action: "block"

  - id: "sqli-stacked-005"
    title: "ALTER TABLE via stacked query"
    tags: ["sqli", "stacked", "paranoia-1"]
    request:
      method: "GET"
      path: "/api/users"
      query_string: "id=1; ALTER TABLE users ADD COLUMN backdoor VARCHAR(255)--"
    expected:
      status: 403
      action: "block"

  - id: "sqli-stacked-006"
    title: "EXEC xp_cmdshell (MSSQL)"
    tags: ["sqli", "stacked", "mssql", "paranoia-1"]
    request:
      method: "GET"
      path: "/api/users"
      query_string: "id=1; EXEC xp_cmdshell('whoami')--"
    expected:
      status: 403
      action: "block"

  - id: "sqli-stacked-007"
    title: "Multiple stacked queries"
    tags: ["sqli", "stacked", "paranoia-1"]
    request:
      method: "GET"
      path: "/api/users"
      query_string: "id=1; DROP TABLE users; DROP TABLE orders; DROP TABLE sessions--"
    expected:
      status: 403
      action: "block"

  - id: "sqli-stacked-008"
    title: "Stacked query in POST body"
    tags: ["sqli", "stacked", "paranoia-1"]
    request:
      method: "POST"
      path: "/api/query"
      headers:
        Content-Type: "application/x-www-form-urlencoded"
      body: "search=test'; DROP TABLE products;--"
    expected:
      status: 403
      action: "block"
