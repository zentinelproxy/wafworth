[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wafworth"
version = "0.1.0"
description = "Is your WAF worth it? \u2014 WAF-agnostic testing framework with encoding auto-generation and multi-WAF comparison"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Zentinel", email = "eng@zentinel.io" }]
keywords = ["waf", "security", "testing", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "click>=8.1,<9.0",
    "httpx[http2]>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
    "rich>=13.0,<14.0",
    "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.3,<1.0",
]

[project.scripts]
wafworth = "wafworth.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/wafworth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
