SecRuleEngine On
SecRequestBodyAccess On

# SQL Injection - Query String
SecRule QUERY_STRING "@detectSQLi" "id:942100,phase:1,deny,status:403,msg:'SQL Injection in Query String'"
SecRule REQUEST_URI "@detectSQLi" "id:942101,phase:1,deny,status:403,msg:'SQL Injection in URI'"

# SQL Injection - Body
SecRule ARGS "@detectSQLi" "id:942200,phase:2,deny,status:403,msg:'SQL Injection in Body'"

# SQL Injection - Keywords
SecRule QUERY_STRING "@contains union select" "id:942300,phase:1,deny,status:403,msg:'UNION SELECT'"
SecRule QUERY_STRING "@contains information_schema" "id:942301,phase:1,deny,status:403,msg:'information_schema probe'"
SecRule QUERY_STRING "@contains sleep(" "id:942302,phase:1,deny,status:403,msg:'SQL sleep injection'"
SecRule QUERY_STRING "@contains benchmark(" "id:942303,phase:1,deny,status:403,msg:'SQL benchmark injection'"
SecRule QUERY_STRING "@contains extractvalue(" "id:942304,phase:1,deny,status:403,msg:'SQL extractvalue injection'"
SecRule QUERY_STRING "@contains updatexml(" "id:942305,phase:1,deny,status:403,msg:'SQL updatexml injection'"

# XSS - Query String
SecRule QUERY_STRING "@detectXSS" "id:941100,phase:1,deny,status:403,msg:'XSS in Query String'"
SecRule REQUEST_URI "@detectXSS" "id:941101,phase:1,deny,status:403,msg:'XSS in URI'"

# XSS - Body
SecRule ARGS "@detectXSS" "id:941200,phase:2,deny,status:403,msg:'XSS in Body'"

# XSS - Keywords
SecRule QUERY_STRING "@contains <script" "id:941300,phase:1,deny,status:403,msg:'Script tag in query'"
SecRule QUERY_STRING "@contains javascript:" "id:941301,phase:1,deny,status:403,msg:'javascript: URI'"
SecRule QUERY_STRING "@contains onerror=" "id:941302,phase:1,deny,status:403,msg:'onerror handler'"
SecRule QUERY_STRING "@contains onload=" "id:941303,phase:1,deny,status:403,msg:'onload handler'"
SecRule QUERY_STRING "@contains onclick=" "id:941304,phase:1,deny,status:403,msg:'onclick handler'"
SecRule QUERY_STRING "@contains onmouseover=" "id:941305,phase:1,deny,status:403,msg:'onmouseover handler'"

# Path Traversal
SecRule REQUEST_URI "@contains ../" "id:930100,phase:1,deny,status:403,msg:'Path traversal ../'"
SecRule REQUEST_URI "@contains ..%2f" "id:930101,phase:1,deny,status:403,msg:'Path traversal encoded'"
SecRule REQUEST_URI "@contains %2e%2e/" "id:930102,phase:1,deny,status:403,msg:'Path traversal double encoded'"
SecRule REQUEST_URI "@contains /etc/passwd" "id:930110,phase:1,deny,status:403,msg:'etc/passwd access'"
SecRule REQUEST_URI "@contains /etc/shadow" "id:930111,phase:1,deny,status:403,msg:'etc/shadow access'"
SecRule REQUEST_URI "@contains /proc/self" "id:930112,phase:1,deny,status:403,msg:'/proc/self access'"
SecRule QUERY_STRING "@contains ../" "id:930200,phase:1,deny,status:403,msg:'Path traversal in query'"
SecRule QUERY_STRING "@contains /etc/passwd" "id:930201,phase:1,deny,status:403,msg:'etc/passwd in query'"

# Command Injection
SecRule QUERY_STRING "@contains ;cat " "id:932100,phase:1,deny,status:403,msg:'Command injection - cat'"
SecRule QUERY_STRING "@contains |cat " "id:932101,phase:1,deny,status:403,msg:'Command injection - pipe cat'"
SecRule QUERY_STRING "@contains `cat " "id:932102,phase:1,deny,status:403,msg:'Command injection - backtick cat'"
SecRule QUERY_STRING "@contains ;ls " "id:932103,phase:1,deny,status:403,msg:'Command injection - ls'"
SecRule QUERY_STRING "@contains ;id" "id:932104,phase:1,deny,status:403,msg:'Command injection - id'"
SecRule QUERY_STRING "@contains ;whoami" "id:932105,phase:1,deny,status:403,msg:'Command injection - whoami'"
SecRule QUERY_STRING "@contains $(cat" "id:932106,phase:1,deny,status:403,msg:'Command injection - subshell cat'"
SecRule QUERY_STRING "@contains ;curl " "id:932107,phase:1,deny,status:403,msg:'Command injection - curl'"
SecRule QUERY_STRING "@contains ;wget " "id:932108,phase:1,deny,status:403,msg:'Command injection - wget'"
SecRule QUERY_STRING "@contains /bin/sh" "id:932109,phase:1,deny,status:403,msg:'Command injection - /bin/sh'"
SecRule QUERY_STRING "@contains /bin/bash" "id:932110,phase:1,deny,status:403,msg:'Command injection - /bin/bash'"

# SSRF
SecRule QUERY_STRING "@contains http://169.254.169.254" "id:931100,phase:1,deny,status:403,msg:'SSRF - AWS metadata'"
SecRule QUERY_STRING "@contains http://metadata.google" "id:931101,phase:1,deny,status:403,msg:'SSRF - GCP metadata'"
SecRule QUERY_STRING "@contains http://100.100.100.200" "id:931102,phase:1,deny,status:403,msg:'SSRF - Alibaba metadata'"
SecRule QUERY_STRING "@contains file://" "id:931103,phase:1,deny,status:403,msg:'SSRF - file:// scheme'"
SecRule QUERY_STRING "@contains gopher://" "id:931104,phase:1,deny,status:403,msg:'SSRF - gopher:// scheme'"
SecRule QUERY_STRING "@contains dict://" "id:931105,phase:1,deny,status:403,msg:'SSRF - dict:// scheme'"
SecRule QUERY_STRING "@contains http://127.0.0.1" "id:931106,phase:1,deny,status:403,msg:'SSRF - localhost'"
SecRule QUERY_STRING "@contains http://localhost" "id:931107,phase:1,deny,status:403,msg:'SSRF - localhost name'"
SecRule QUERY_STRING "@contains http://0.0.0.0" "id:931108,phase:1,deny,status:403,msg:'SSRF - 0.0.0.0'"
SecRule QUERY_STRING "@contains http://[::1]" "id:931109,phase:1,deny,status:403,msg:'SSRF - IPv6 loopback'"

# SSTI
SecRule QUERY_STRING "@contains {{" "id:934100,phase:1,deny,status:403,msg:'Template injection - double braces'"
SecRule QUERY_STRING "@contains ${" "id:934101,phase:1,deny,status:403,msg:'Template injection - dollar brace'"
SecRule QUERY_STRING "@contains #{" "id:934102,phase:1,deny,status:403,msg:'Template injection - hash brace'"
SecRule QUERY_STRING "@contains <%=" "id:934103,phase:1,deny,status:403,msg:'Template injection - ERB'"

# Scanner Detection
SecRule REQUEST_HEADERS:User-Agent "@contains sqlmap" "id:913100,phase:1,deny,status:403,msg:'Scanner - sqlmap'"
SecRule REQUEST_HEADERS:User-Agent "@contains nikto" "id:913101,phase:1,deny,status:403,msg:'Scanner - nikto'"
SecRule REQUEST_HEADERS:User-Agent "@contains nmap" "id:913102,phase:1,deny,status:403,msg:'Scanner - nmap'"
SecRule REQUEST_HEADERS:User-Agent "@contains masscan" "id:913103,phase:1,deny,status:403,msg:'Scanner - masscan'"
SecRule REQUEST_HEADERS:User-Agent "@contains nessus" "id:913104,phase:1,deny,status:403,msg:'Scanner - nessus'"
SecRule REQUEST_HEADERS:User-Agent "@contains dirbuster" "id:913105,phase:1,deny,status:403,msg:'Scanner - dirbuster'"
SecRule REQUEST_HEADERS:User-Agent "@contains gobuster" "id:913106,phase:1,deny,status:403,msg:'Scanner - gobuster'"

# CVE Patterns
SecRule REQUEST_URI "@contains /cgi-bin/php" "id:944100,phase:1,deny,status:403,msg:'PHP CGI attack'"
SecRule REQUEST_URI "@contains /wp-login.php" "id:944101,phase:1,deny,status:403,msg:'WordPress login probe'"
SecRule REQUEST_URI "@contains /.env" "id:944102,phase:1,deny,status:403,msg:'.env exposure'"
SecRule REQUEST_URI "@contains /.git" "id:944103,phase:1,deny,status:403,msg:'.git exposure'"
SecRule REQUEST_URI "@contains /actuator" "id:944104,phase:1,deny,status:403,msg:'Spring actuator probe'"
SecRule REQUEST_URI "@contains /server-status" "id:944105,phase:1,deny,status:403,msg:'Apache status probe'"
SecRule REQUEST_URI "@contains /elmah.axd" "id:944106,phase:1,deny,status:403,msg:'ELMAH probe'"
SecRule REQUEST_URI "@contains /debug/pprof" "id:944107,phase:1,deny,status:403,msg:'Go pprof probe'"
